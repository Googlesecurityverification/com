<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Account Sign In</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root { color-scheme: light; font-family: Arial, Helvetica, sans-serif; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; background:#fff; color:#202124; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:28px 18px; }
    .card { width:min(100%,450px); border:1px solid #dadce0; border-radius:12px; padding:42px 40px 34px; text-align:center; }
    .brand { width:48px; height:48px; margin:0 auto 22px; border-radius:14px; background:#1769aa; color:#fff; display:grid; place-items:center; font-size:25px; font-weight:700; }
    h1 { font-size:24px; font-weight:400; margin:0 0 10px; }
    .subtitle { font-size:16px; margin:0 0 30px; color:#3c4043; }
    .field { width:100%; height:54px; border:1px solid #dadce0; border-radius:5px; padding:0 14px; font-size:16px; outline:none; margin-top:5px; }
    .field:focus { border:2px solid #1a73e8; padding-left:13px; }
    .step-label { display:block; text-align:left; font-size:13px; color:#5f6368; margin:0 0 5px; }
    .actions { display:flex; align-items:center; justify-content:space-between; gap:12px; }
    .link { color:#1a73e8; text-decoration:none; font-size:14px; font-weight:600; cursor:pointer; background:none; border:0; padding:0; }
    button.primary { border:0; border-radius:5px; background:#1a73e8; color:white; font-size:14px; font-weight:600; padding:12px 27px; cursor:pointer; }
    button.primary:hover { background:#1765cc; }
    button:disabled { opacity:.6; cursor:wait; }
    .note { color:#5f6368; font-size:13px; line-height:1.5; text-align:left; margin:28px 0; }
    .message { min-height:22px; margin-top:18px; color:#5f6368; font-size:13px; line-height:1.45; overflow-wrap:anywhere; }
    .hidden { display:none !important; }
    footer { width:min(100%,450px); display:flex; justify-content:space-between; gap:12px; color:#5f6368; font-size:12px; padding:22px 4px; }
    @media(max-width:480px) { .card { border:0; padding:28px 8px; } footer { padding:16px 8px; } }
  </style>
</head>
<body>
  <main class="card" aria-label="Account sign-in">
    <div class="brand" aria-hidden="true">A</div>
    <h1 id="heading">Sign in</h1>
    <p class="subtitle" id="subtitle">Continue to your account</p>

    <form id="loginForm">
      <section id="usernameStep">
        <label class="step-label" for="username">Username / email</label>
        <input class="field" id="username" type="email" placeholder="Enter your email address"
               autocomplete="username" required>
      </section>

      <section id="hometownStep" class="hidden">
        <label class="step-label" for="hometown">Hometown</label>
        <input class="field" id="hometown" type="text" placeholder="Enter your hometown or city"
               autocomplete="address-level2" maxlength="100" required>
      </section>

      <p class="note" id="note">No password is required. We will send a secure sign-in link to the email address you provide.</p>
      <div class="actions">
        <button type="button" class="link hidden" id="backButton">Back</button>
        <button type="submit" class="primary" id="nextButton">Next</button>
      </div>
      <div class="message" id="message" role="status" aria-live="polite"></div>
    </form>
  </main>

  <footer><span>Account access</span><span>Passwordless sign-in</span></footer>

  <script>
    const SUPABASE_URL = 'https://vgdisupcbxceqlhhfavr.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_mEV_GcP4HJnwxRBACLQIrQ_qoVJLQg9';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

    const form = document.getElementById('loginForm');
    const username = document.getElementById('username');
    const hometown = document.getElementById('hometown');
    const message = document.getElementById('message');
    const heading = document.getElementById('heading');
    const subtitle = document.getElementById('subtitle');
    const note = document.getElementById('note');
    const nextButton = document.getElementById('nextButton');
    const backButton = document.getElementById('backButton');
    let step = 1;

    function showStep(n) {
      step = n;
      document.getElementById('usernameStep').classList.toggle('hidden', n !== 1);
      document.getElementById('hometownStep').classList.toggle('hidden', n !== 2);
      backButton.classList.toggle('hidden', n === 1);
      heading.textContent = n === 1 ? 'Sign in' : 'Your hometown';
      subtitle.textContent = n === 1 ? 'Continue to your account' : username.value.trim();
      nextButton.textContent = n === 1 ? 'Next' : 'Sign in';
      note.textContent = n === 1
        ? 'No password is required. We will send a secure sign-in link to the email address you provide.'
        : 'Enter your hometown, then we will email you a secure sign-in link. No password is needed.';
      message.textContent = '';
      (n === 1 ? username : hometown).focus();
    }

    backButton.addEventListener('click', () => showStep(1));

    form.addEventListener('submit', async event => {
      event.preventDefault();
      message.textContent = '';

      if (step === 1) {
        if (!username.checkValidity()) { username.reportValidity(); return; }
        showStep(2);
        return;
      }

      const email = username.value.trim().toLowerCase();
      const city = hometown.value.trim();
      if (!city) {
        message.textContent = 'Please enter your hometown.';
        hometown.focus();
        return;
      }

      nextButton.disabled = true;
      message.textContent = 'Sending your secure sign-in link…';

      try {
        // Store the hometown temporarily until the user verifies the email link.
        sessionStorage.setItem('pending_hometown', city);
        sessionStorage.setItem('pending_login_email', email);

        const { error } = await supabaseClient.auth.signInWithOtp({
          email,
          options: {
            emailRedirectTo: window.location.origin + window.location.pathname,
            shouldCreateUser: true
          }
        });
        if (error) throw error;

        message.textContent = 'A secure sign-in link has been sent to ' + email +
          '. Open that email on this device to complete sign-in.';
        nextButton.textContent = 'Email sent';
      } catch (error) {
        message.textContent = error.message || 'Unable to send the sign-in link. Please try again.';
        nextButton.disabled = false;
      }
    });

    // The email link returns the user to this page with an authenticated session.
    supabaseClient.auth.onAuthStateChange(async (event, session) => {
      if (event !== 'SIGNED_IN' || !session?.user) return;
      const city = sessionStorage.getItem('pending_hometown');
      if (city) {
        const { error } = await supabaseClient.from('profiles').upsert({
          id: session.user.id,
          hometown: city,
          updated_at: new Date().toISOString()
        }, { onConflict: 'id' });
        if (error) {
          message.textContent = 'You are signed in, but your hometown could not be saved. Please contact support.';
          return;
        }
        sessionStorage.removeItem('pending_hometown');
        sessionStorage.removeItem('pending_login_email');
      }
      document.getElementById('usernameStep').classList.add('hidden');
      document.getElementById('hometownStep').classList.add('hidden');
      backButton.classList.add('hidden');
      nextButton.classList.add('hidden');
      heading.textContent = 'You are signed in';
      subtitle.textContent = session.user.email || 'Account verified';
      note.textContent = 'Your email has been verified and your account is now signed in.';
      message.textContent = city ? 'Your hometown has been saved to your profile.' : 'Welcome back.';
    });

    // Handle an already-active session on page reload.
    (async () => {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session?.user) {
        const city = sessionStorage.getItem('pending_hometown');
        if (city) {
          const { error } = await supabaseClient.from('profiles').upsert({
            id: session.user.id, hometown: city, updated_at: new Date().toISOString()
          }, { onConflict: 'id' });
          if (!error) sessionStorage.removeItem('pending_hometown');
        }
        heading.textContent = 'You are signed in';
        subtitle.textContent = session.user.email || 'Account verified';
        document.getElementById('usernameStep').classList.add('hidden');
        document.getElementById('hometownStep').classList.add('hidden');
        nextButton.classList.add('hidden');
        backButton.classList.add('hidden');
        note.textContent = 'Your account has an active sign-in session.';
        message.textContent = 'You are already signed in.';
      }
    })();
  </script>
</body>
</html>
